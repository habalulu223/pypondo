[build]
  builder = "paketo"
  
[deploy]
  startCommand = "python app.py"
  restartPolicyMaxRetries = 5
  restartPolicyWindowSeconds = 60

[[services]]
  name = "pypondo-backend"
  
  [services.build]
    builder = "paketo"
    buildpacks = [
      "paketo-buildpacks/python"
    ]

  [services.deploy]
    startCommand = "python app.py"
    healthcheckPath = "/api/health"
    healthcheckInterval = 30
    healthcheckTimeout = 5
