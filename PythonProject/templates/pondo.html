<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Credits</title>
    <link rel='icon' type='image/x-icon' href='/favicon.ico'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pondo.css') }}">{% include '_dashboard_container_theme.html' %}</head>
<body>
    {% include '_dashboard_nav.html' %}
    {% include '_loading_overlay.html' %}
    {% include '_startup_splash.html' %}

    <div class="card">
        <h1>LOAD PONDO</h1>
        <form method="POST">
            {% if current_user.is_admin %}
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            {% endif %}
            <input type="number" step="0.01" name="amount" placeholder="Amount (PHP)" required>
            <button type="submit">CONFIRM RELOAD</button>
        </form>
        <a href="/">← Return to Dashboard</a>
    </div>

    <script src="{{ url_for('static', filename='js/pondo.js') }}" defer></script>
</body>
</html>
