<style>
    body {
        background-color: #16090d !important;
    }

    .cyber-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.9s ease, transform 1s ease, filter 0.9s ease;
    }

    body.startup-active .cyber-bg {
        opacity: 0.08;
    }

    body.startup-complete .cyber-bg {
        opacity: 1;
    }

    .cyber-bg::before,
    .cyber-bg::after {
        content: "";
        position: absolute;
        inset: -12%;
        background:
            radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, rgba(255, 45, 70, 0.16) 22%, rgba(0, 0, 0, 0) 52%),
            radial-gradient(circle at 18% 20%, rgba(255, 35, 62, 0.2) 0%, rgba(0, 0, 0, 0) 36%),
            radial-gradient(circle at 82% 78%, rgba(255, 255, 255, 0.11) 0%, rgba(0, 0, 0, 0) 30%);
        animation: bgPulse 8s ease-in-out infinite alternate;
    }

    .cyber-bg::after {
        display: none;
    }

    .cyber-grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255, 65, 85, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 65, 85, 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        background-image:
            linear-gradient(rgba(255, 65, 85, 0.09) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 65, 85, 0.09) 1px, transparent 1px),
            linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 48px 48px, 48px 48px, 12px 12px, 12px 12px;
        mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.95) 24%, rgba(0, 0, 0, 0.5) 58%, transparent 86%);
        opacity: 0.62;
    }

    .cyber-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .cyber-wire {
        fill: none;
        stroke: rgba(255, 95, 112, 0.68);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .cyber-wire-glow {
        fill: none;
        stroke: rgba(255, 255, 255, 0.28);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: none;
    }

    .cyber-pulse {
        fill: none;
        stroke: rgba(255, 255, 255, 1);
        stroke-width: 3.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* One moving neon dash per circuit path. */
        stroke-dasharray: 8 560;
        animation: wireCurrent 2.35s linear infinite;
        filter: none;
    }

    .cyber-pulse.delay-1 { animation-delay: -0.9s; }
    .cyber-pulse.delay-2 { animation-delay: -1.8s; }
    .cyber-pulse.delay-3 { animation-delay: -2.4s; }

    .cyber-trace { fill:none; stroke:rgba(255,105,120,.48); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .cyber-bolt { fill:none; stroke:#fff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:5 95; animation: wireCurrent 1.1s linear infinite; filter:none; }
    .cyber-bolt.b2 { animation-delay:-.38s; }
    .cyber-bolt.b3 { animation-delay:-.76s; }

    .cyber-node {
        fill: rgba(45, 8, 15, 0.95);
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 2;
    }

    .cyber-node.hot {
        fill: rgba(255, 40, 65, 0.48);
        stroke: rgba(255, 255, 255, 1);
        filter: none;
        animation: nodeBlink 2.2s ease-in-out infinite;
    }

    .cyber-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(28vw, 230px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
    }

    .cyber-core::before,
    .cyber-core::after {
        content: "";
        position: absolute;
        inset: -22%;
        border-radius: 28%;
        border: 1px solid rgba(255, 70, 90, 0.42);
        box-shadow: inset 0 0 12px rgba(255, 45, 70, 0.1);
        animation: coreRotate 16s linear infinite;
    }

    .cyber-core::after {
        inset: -10%;
        border-radius: 36%;
        border-color: rgba(255, 255, 255, 0.32);
        animation-direction: reverse;
        animation-duration: 10s;
    }

    .cyber-core-ring {
        position: absolute;
        inset: 6%;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.36);
        box-shadow: inset 0 0 12px rgba(255, 45, 70, 0.14);
    }

    .cyber-core-shell {
        position: absolute;
        inset: 16%;
        border-radius: 50%;
        background:
            radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.14), transparent 34%),
            radial-gradient(circle at center, rgba(48, 10, 17, 0.97) 0%, rgba(20, 7, 11, 0.99) 72%);
        border: 1px solid rgba(255, 90, 108, 0.58);
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.35);
        overflow: hidden;
    }

    .cyber-core-shell::before {
        content: "";
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.36);
        animation: coreRotate 12s linear infinite reverse;
    }

    .cyber-core-icon {
        position: absolute;
        width: 40%;
        max-width: 84px;
        filter: none;
        animation: iconFloat 3.8s ease-in-out infinite;
    }

    .cyber-sparks {
        position: absolute;
        inset: 0;
    }

    .cyber-sparks span {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 48, 70, 0.85) 40%, rgba(255, 48, 70, 0) 72%);
        box-shadow: none;
        animation: sparkOrbit 4.8s linear infinite;
    }

    .cyber-sparks span:nth-child(1) { top: 6%; left: 50%; animation-delay: -0.2s; }
    .cyber-sparks span:nth-child(2) { top: 50%; left: 8%; animation-delay: -1.7s; }
    .cyber-sparks span:nth-child(3) { right: 12%; top: 44%; animation-delay: -3.1s; }
    .cyber-sparks span:nth-child(4) { left: 46%; bottom: 8%; animation-delay: -4.2s; }

    body > *:not(.cyber-bg) {
        position: relative;
        z-index: 1;
    }

    @keyframes wireCurrent {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -568; }
    }

    @keyframes coreRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes bgPulse {
        from { opacity: 0.72; }
        to { opacity: 1; }
    }

    @keyframes nodeBlink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
    }

    @keyframes iconFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
    }

    @keyframes sparkOrbit {
        0%, 100% { transform: scale(0.8); opacity: 0.4; }
        40% { transform: scale(1.2); opacity: 1; }
        75% { transform: scale(0.9); opacity: 0.6; }
    }

    @media (max-width: 700px) {
        .cyber-core {
            width: min(46vw, 180px);
        }

        .cyber-grid {
            background-size: 42px 42px;
        }

        .cyber-wire,
        .cyber-pulse {
            stroke-width: 2.3;
        }
    }
</style>
