<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ pc.name }} QR | PyPondo</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#243247;background:#f3f5f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#e4edf8 0,transparent 35%),#f3f5f9}
    .qr-card{width:min(100%,520px);padding:clamp(22px,5vw,34px);text-align:center;background:#fff;border:1px solid #dfe5ee;border-radius:20px;box-shadow:0 18px 50px rgba(23,32,51,.09)}
    .eyebrow{color:#68778d;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:9px 0;color:#1f3048;font-size:clamp(1.7rem,6vw,2.2rem)}
    .description{margin:0;color:#68778d}
    .qr-image{display:block;width:min(100%,300px);height:auto;margin:24px auto;border:9px solid #fff;border-radius:12px;box-shadow:0 0 0 1px #e1e7f0,0 8px 24px rgba(25,42,70,.08)}
    .payload{padding:12px;background:#f4f7fb;border:1px solid #e5ebf3;border-radius:10px;color:#53637a;font-size:.88rem;overflow-wrap:anywhere}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    .actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:11px 15px;border:1px solid #315d91;border-radius:9px;background:#315d91;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    .actions .secondary{background:#f5f8fc;color:#24466f;border-color:#cbd8e8}
    .actions a:hover,.actions button:hover{filter:brightness(.94)}
    .pc-qr-link{display:inline-flex;align-items:center;gap:7px;margin:2px 0 10px;padding:8px 11px;border:1px solid #d7e2f0;border-radius:9px;background:#eaf1fa;color:#315d91!important;text-decoration:none;font-size:.82rem;font-weight:750}
    .pc-qr-link:hover{background:#dfeafa}
    @media print{body{min-height:auto;padding:0;background:#fff}.qr-card{border:0;box-shadow:none}.actions{display:none}.payload{background:#fff}}
  </style>
</head>
<body>
  {% include '_animated_background.html' %}
  <main class="qr-card">
    <div class="eyebrow">PyPondo PC identification</div>
    <h1>{{ pc.name }}</h1>
    <p class="description">Unique QR label for this registered PC</p>
    <img class="qr-image" src="{{ url_for('download_pc_qr', pc_id=pc.id) }}" alt="QR code for {{ pc.name }}">
    <div class="payload">PC ID: {{ pc.id }} · Name: {{ pc.name }}</div>
    <div class="actions">
      <button type="button" onclick="window.print()">Print label</button>
      <a class="secondary" href="{{ url_for('download_pc_qr', pc_id=pc.id) }}">Download PNG</a>
      <a class="secondary" href="{{ url_for('index') }}">Back to dashboard</a>
    </div>
  </main>
</body>
</html>
