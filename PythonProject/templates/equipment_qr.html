<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment QR · {{ item.equipment_name }}</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif;background:#160a0e;color:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(480px,100%);text-align:center;padding:26px;border:1px solid #79303d;border-radius:18px;background:#241116;box-shadow:0 18px 60px #0008}
    h1{margin:0 0 8px;font-size:1.6rem}p{color:#e4cbd0}.code{font-family:ui-monospace,monospace;color:#fff}
    img{display:block;width:min(320px,100%);aspect-ratio:1;object-fit:contain;margin:20px auto;padding:12px;background:#fff;border-radius:12px}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}a,button{border:1px solid #ff9bad;border-radius:9px;padding:10px 14px;background:#b31735;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    @media print{body{background:#fff;color:#111}main{box-shadow:none;border:0;background:#fff}p{color:#333}.actions{display:none}img{border:1px solid #ddd}}
  </style>
</head>
<body>
  <main>
    <h1>{{ item.equipment_name }}</h1>
    <p><span class="code">{{ item.equipment_code }}</span> · {{ item.category.category_name if item.category else 'Equipment' }}</p>
    <img src="{{ url_for('community_equipment_qr_image', equipment_id=item.equipment_id) }}" alt="QR code for {{ item.equipment_name }}">
    <p>Scan this code in the PyPondo mobile app to view this equipment record and malfunction reports.</p>
    <div class="actions">
      <a href="{{ url_for('community_equipment_qr_image', equipment_id=item.equipment_id) }}" download="equipment-{{ item.equipment_id }}-qr.svg">Download QR</a>
      <button type="button" onclick="window.print()">Print label</button>
      <a href="{{ url_for('equipment_dashboard', view='inventory') }}">Back to products</a>
    </div>
  </main>
</body>
</html>
