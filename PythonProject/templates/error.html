<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ code }} &middot; {{ title }} | Techpuls</title>
  <link rel="icon" href="{{ url_for('app_icon') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}"></head>
<body>
  <main class="error-card">
    <div class="eyebrow">Techpuls</div>
    <p class="code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>
    <div class="actions">
      <a href="{{ url_for('index') }}">Back to dashboard</a>
      {% if current_user.is_authenticated and current_user.can_manage_equipment %}
        <a class="secondary" href="{{ url_for('equipment_dashboard') }}">Equipment inventory</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
