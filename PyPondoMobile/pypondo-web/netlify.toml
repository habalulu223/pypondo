# Netlify Configuration for PyPondo Web Frontend

[build]
  # Build command to generate production files
  command = "npm run build"
  
  # Directory to publish (output of build)
  publish = "dist"
  
  # Node version
  node_version = "20"

# Production environment variables
[context.production.environment]
  VITE_API_URL = "https://your-backend.herokuapp.com"
  VITE_API_TIMEOUT = "30000"

# Preview environment variables
[context.deploy-preview.environment]
  VITE_API_URL = "https://your-backend.herokuapp.com"
  VITE_API_TIMEOUT = "30000"

# Development environment variables
[context.branch-deploy.environment]
  VITE_API_URL = "https://your-backend.herokuapp.com"
  VITE_API_TIMEOUT = "30000"

# Redirect all API calls to backend (adjust path as needed)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend.herokuapp.com/api/:splat"
  status = 200
  force = false

# SPA routing - redirect not found pages to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache policy for static assets
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
